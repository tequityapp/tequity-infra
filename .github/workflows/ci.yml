name: CI

on:
  push:
    branches: [main]
  # Run contributor-controlled code only with the unprivileged PR event.
  # Forks are rejected before persistent self-hosted runner assignment.
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  pulumi:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@verjson'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm run scan:secrets
      - run: npm run build
      - run: npm test
      - run: npm run test:vault-render
