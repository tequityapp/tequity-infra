name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@58a82143d28bc84c163d3fed092d8d9425b91a62
    with:
      node-version: 24.19.0
      secretless-pr: true
      approved-internal-scopes: "@verjson"
      # The current lock has no internal packages. The canonical callee binds
      # that empty set to VERJSON_SECRETLESS_PACKAGE_POLICY before acquisition.
      secretless-ci-script-plan: '["scan:secrets","build","test","test:dependencies","test:vault-render","preview:offline","audit:production"]'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  trusted-ref:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@58a82143d28bc84c163d3fed092d8d9425b91a62
    with:
      node-version: 24.19.0
      secretless-trusted-ref: true
      approved-internal-scopes: "@verjson"
      # Keep the empty package policy and validation plan at PR parity.
      # VERJSON_SECRETLESS_PACKAGE_POLICY protects both invocations.
      secretless-ci-script-plan: '["scan:secrets","build","test","test:dependencies","test:vault-render","preview:offline","audit:production"]'
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
