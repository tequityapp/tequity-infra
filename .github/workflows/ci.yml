name: CI

on:
  push:
    branches: [main]
  # Run contributor-controlled code only with the unprivileged PR event.
  # Forks are rejected before persistent self-hosted runner assignment.
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  pulumi:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # This repository is PUBLIC. The self-hosted pool sets
    # allows_public_repositories=false, so jobs targeting it are never
    # assigned a runner and queue indefinitely — measured, ~2h with the pool
    # idle. That setting is deliberate: public-repo PR code must not run on a
    # persistent shared runner (ADR-0033 routing, ADR-0041 isolation), and the
    # ephemeral untrusted-PR group is not yet provisioned. GitHub-hosted is the
    # fail-safe tier, and it is free for public repositories.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@verjson'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3
      # GITHUB_TOKEN cannot read another organization's packages, and
      # @verjson/* lives in the Verjson org — it fails with a 403
      # "The requested installation does not exist". The org-level PAT carries
      # cross-org read:packages; github.token stays as the same-org fallback.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      - run: npm run scan:secrets
      - run: npm run build
      - run: npm test
      - run: npm run test:vault-render
