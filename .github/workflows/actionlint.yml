name: actionlint

on:
  # Base-branch workflow definition: a fork cannot edit the admission guard
  # that keeps its content off organization runners.
  pull_request_target:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

jobs:
  actionlint:
    # Fork-authored workflow content is not admitted to organization runners.
    # A safe external-PR execution boundary is tracked at platform#63.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    # This repository is PUBLIC. The self-hosted pool sets
    # allows_public_repositories=false, so jobs targeting it are never
    # assigned a runner and queue indefinitely — measured, ~2h with the pool
    # idle. That setting is deliberate: public-repo PR code must not run on a
    # persistent shared runner (ADR-0033 routing, ADR-0041 isolation), and the
    # ephemeral untrusted-PR group is not yet provisioned. GitHub-hosted is the
    # fail-safe tier, and it is free for public repositories.
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.7
      # From actionlint_1.7.7_checksums.txt on the upstream GitHub Release.
      ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install actionlint (pinned release binary)
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint --version
      - name: Run actionlint over all workflows
        run: ./actionlint -color
